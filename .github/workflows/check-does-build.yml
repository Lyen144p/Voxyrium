
name: Build Voxyrium JAR

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/check-does-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Voxyrium
        run: ./gradlew -I init.gradle build

      - name: Find generated JAR files
        run: |
          echo "=== All generated JAR files ==="
          find . -type f -name "*.jar" \
            -not -path "./.gradle/*" \
            -not -path "./*/.gradle/*" \
            -print
          echo "=== Build directories ==="
          find . -type d -name build -print

      - name: Upload generated JAR files
        uses: actions/upload-artifact@v4
        with:
          name: voxyrium-build-test
          path: |
            **/build/**/*.jar
          if-no-files-found: error
