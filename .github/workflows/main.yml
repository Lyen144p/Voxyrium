name: Build Voxyrium for Minecraft 26.1.2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Voxyrium 26.1.2 branch
        uses: actions/checkout@v4
        with:
          ref: mc_26.1

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew -Pminecraft_version=26.1.2 build

      - name: Show built JAR files
        run: find build -type f -path '*/libs/*.jar' -print

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: voxyrium-mc-26.1.2-test-build
          path: build/**/libs/*.jar
          if-no-files-found: error
          
